<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام مطبعة طارق أبوهمام</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>
<div id="login">
  <div class="card">
    <h2>مطبعة طارق أبوهمام</h2>
    <input id="lu" type="email" placeholder="البريد الإلكتروني">
    <input id="lp" type="password" placeholder="كلمة المرور">
    <button id="lb">دخول</button>
  </div>
</div>
<div id="app" hidden>
  <header>
    <h1>مطبعة طارق أبوهمام</h1>
    <input id="q" placeholder="ابحث بالاسم أو الهاتف">
    <button data-a="newc">+ عميل</button>
    <button data-a="prices">الأسعار</button>
    <button data-a="migrate" class="ghost">استيراد القديم</button>
    <button data-a="out" class="ghost">خروج</button>
  </header>
  <main>
    <section id="stats" class="cards"></section>
    <div class="tabs">
      <button data-f="debt" class="on">المديونية</button>
      <button data-f="all">كل العملاء</button>
      <button data-f="office">المكاتب</button>
    </div>
    <div class="scroll"><table id="clients">
      <thead><tr><th>الاسم</th><th>الهاتف</th><th>النوع</th><th>الفواتير</th><th>المتبقي</th><th>عمر الدين</th><th></th></tr></thead>
      <tbody></tbody>
    </table></div>
  </main>
</div>
<dialog id="dlg"></dialog>
<div id="toasts"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
